name: iOS15

# Compile the fork at an iOS 15.0 deployment floor and, if it links, package the
# .deb. Manual or push to the ios15 branch only; nothing is published.

on:
  workflow_dispatch:
  push:
    branches:
      - ios15

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  build:
    name: Build at iOS 15
    runs-on: xcode-27
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install packaging dependencies
        run: |
          missing=()
          command -v ldid >/dev/null 2>&1 || missing+=(ldid)
          command -v dpkg-deb >/dev/null 2>&1 || missing+=(dpkg)
          command -v zstd >/dev/null 2>&1 || missing+=(zstd)
          if (( ${#missing[@]} )); then brew install "${missing[@]}"; fi
          command -v ldid && command -v dpkg-deb && command -v zstd

      - name: Compile at the iOS 15 floor
        id: compile
        continue-on-error: true
        run: |
          set +e
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          xcodebuild \
            -project Apelin.xcodeproj \
            -scheme Apelin \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -keepGoing \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build > build.log 2>&1
          status=$?
          echo "xcodebuild exit: $status"

          grep -aE "error: " build.log | sort -u > errors.txt || true
          tail -n 4000 build.log > build-tail.log || true
          echo "distinct error lines: $(wc -l < errors.txt)"

          {
            echo "## iOS 15 build"
            echo ""
            echo "- iPhoneOS SDK: \`$SDK\`"
            echo "- xcodebuild exit: \`$status\`"
            echo "- distinct error lines: \`$(wc -l < errors.txt)\`"
            echo ""
            echo '```'
            head -60 errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status

      - name: Package the .deb
        if: steps.compile.outcome == 'success'
        run: |
          make --no-print-directory _package FLAVOR=roothide IOS_SDK_TIER="$SDK" DERIVED_DATA="$RUNNER_TEMP/dd"
          make --no-print-directory _package FLAVOR=rootless IOS_SDK_TIER="$SDK" DERIVED_DATA="$RUNNER_TEMP/dd"
          ls -lh build/Packages/

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios15-${{ github.run_number }}
          path: |
            errors.txt
            build-tail.log
            build/Packages/*.deb
          if-no-files-found: warn
          retention-days: 7
